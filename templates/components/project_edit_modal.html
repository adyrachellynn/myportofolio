<div id="edit-project-modal"
     class="education-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="edit-project-modal-title">

  <button type="button"
          class="education-form-modal__backdrop"
          popovertarget="edit-project-modal"
          popovertargetaction="hide"
          aria-label="Tutup form edit proyek"></button>

  <div class="education-form-modal__content">
    <button type="button"
            class="education-form-modal__close"
            popovertarget="edit-project-modal"
            popovertargetaction="hide"
            aria-label="Tutup form edit proyek">×</button>

    <h2 id="edit-project-modal-title">Edit Proyek</h2>

    <form id="project-edit-form">
      {% csrf_token %}
      <input type="hidden" id="edit-project-id">

      <div class="form-group">
        <label for="edit-project-title">Nama Proyek</label>
        <input type="text" id="edit-project-title" name="title"
               maxlength="255" required>
      </div>

      <div class="form-group">
        <label for="edit-project-description">Deskripsi Proyek</label>
        <textarea id="edit-project-description" name="description"
                  rows="3" required></textarea>
      </div>

      <div class="form-group">
        <label for="edit-project-tech-stack">Teknologi yang Digunakan</label>
        <input type="text" id="edit-project-tech-stack" name="tech_stack"
               maxlength="255" required>
      </div>

      <div class="form-group">
        <label for="edit-project-url">URL Proyek</label>
        <input type="url" id="edit-project-url" name="project_url">
      </div>

      <div class="form-group">
        <label for="edit-project-image-url">URL Gambar Proyek</label>
        <input type="url" id="edit-project-image-url"
               name="project_image_url">
      </div>

      <div class="education-form-modal__actions">
        <button type="button" class="button button-secondary"
                popovertarget="edit-project-modal"
                popovertargetaction="hide">
          Batal
        </button>
        <button type="submit" class="button">
          Simpan Perubahan
        </button>
      </div>
    </form>
  </div>
</div>
